<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Space+Grotesk:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>

<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="site-header">

    <nav class="nav-left">
        <a href="index.html#work">WORK</a>
        <a href="index.html#about">ABOUT</a>
    </nav>

    <a href="index.html" class="logo">
        WES GONTER
    </a>

    <nav class="nav-right">
        <a href="index.html#shop">SHOP</a>
        <a href="contact.html">CONTACT</a>
    </nav>

</header>


<!-- =========================================================
     CONTACT PAGE
     ========================================================= -->

<main class="contact-page">

    <div class="contact-page-inner">

        <h1>contact</h1>


        <!-- =================================================
             CONTACT FORM
             ================================================= -->

        <form
            class="contact-form"
            action="https://formsubmit.co/wesgonter@gmail.com"
            method="POST"
        >

            <!-- NAME -->

            <div class="form-field">

                <label for="name">
                    Name *
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your Name..."
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-field">

                <label for="email">
                    Email Address *
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Your Email Address..."
                    required
                >

            </div>


            <!-- MESSAGE -->

            <div class="form-field">

                <label for="message">
                    Message *
                </label>

                <textarea
                    id="message"
                    name="message"
                    placeholder="Your Message..."
                    required
                ></textarea>

            </div>


            <!-- =================================================
                 EMAIL SETTINGS
                 ================================================= -->

            <!-- Subject of the email you receive -->

            <input
                type="hidden"
                name="_subject"
                value="New message from Wes Gonter Portfolio"
            >
            <input
                type="hidden"
                name="_next"
                value="https://wesleygonter.github.io/thank-you.html"
            >

            <!-- Use the visitor's email as the Reply-To address -->

            <input
                type="hidden"
                name="_replyto"
                value="email"
            >


            <!-- =================================================
                 SUBMIT
                 ================================================= -->

            <button
                type="submit"
                class="contact-submit"
            >
                Submit
            </button>

        </form>

    </div>

</main>


<!-- =========================================================
     FOOTER
     ========================================================= -->

<footer>

    <span>
        WES GONTER © 2026
    </span>

    <span>
        DESIGN / ENGINEERING / MAKING
    </span>

</footer>

</body>
</html>
